name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-dir
        continue-on-error: true

      - name: Create gh-pages branch if it doesn't exist
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/RobertRuas/PWA-Reports.git temp-repo
          cd temp-repo
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout --orphan gh-pages || git checkout gh-pages
          rm -rf *
          touch .gitkeep
          git add .
          git commit -m "Init gh-pages" || true
          git push origin gh-pages || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        run: |
          cd /tmp
          git clone --depth 1 --branch gh-pages https://github.com/RobertRuas/PWA-Reports.git deploy-repo
          cd deploy-repo
          rm -rf *
          cp -r ${{ github.workspace }}/dist/* .
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Deploy: ${{ github.sha }}" || true
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
