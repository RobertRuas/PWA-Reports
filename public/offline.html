<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PWA Starter Kit - Offline</title>
  <style>
    :root {
      --primary: #24527A;
      --bg: #f5f5f5;
      --text: #333;
      --muted: #888;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --text: #eee;
        --muted: #999;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 360px; }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      color: var(--primary);
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 14px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      min-height: 44px;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M93.72 183.25C130.05 120.37 197.58 80 272 80c99.16 0 182.95 66.89 209.98 160" stroke="currentColor" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M73.16 260.56C86.5 352.84 165.23 424 260.36 424c56.6 0 107.36-26.48 140.14-67.69" stroke="currentColor" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="48" y1="48" x2="464" y2="464" stroke="currentColor" stroke-width="32" stroke-linecap="round"/>
    </svg>
    <h1>Você está offline</h1>
    <p>Sem conexão com a internet. Quando a conexão for restabelecida, a aplicação voltará automaticamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
